server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve the gateway at request time, not once at start-up: a restarted container gets a new
    # IP. NGINX_LOCAL_RESOLVERS is filled in from /etc/resolv.conf by the nginx image's entrypoint.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass $gateway;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The AI coach can take a while when a real LLM is configured.
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
