  labels: { app: coach-service, tier: app }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: coach-service }
  template:
    metadata:
      labels: { app: coach-service, tier: app }
