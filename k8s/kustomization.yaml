apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gigpay
resources:
  - namespace.yaml
  - config.yaml
  - infra.yaml
  - apps.yaml
  - frontend.yaml
  - network-policy.yaml
# Point the images at your registry, e.g.  kustomize edit set image ghcr.io/your-org/...=...
images:
  - name: ghcr.io/your-org/gigpay-gateway
    newTag: 1.0.0
  - name: ghcr.io/your-org/gigpay-earnings-service
    newTag: 1.0.0
  - name: ghcr.io/your-org/gigpay-ledger-service
    newTag: 1.0.0
  - name: ghcr.io/your-org/gigpay-coach-service
    newTag: 1.0.0
  - name: ghcr.io/your-org/gigpay-frontend
    newTag: 1.0.0
