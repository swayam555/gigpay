# Full stack:  docker compose up --build   then open http://localhost:3003 (finance console at /finance)
# Optional LLM for the coach:  AI_PROVIDER=openai AI_API_KEY=... AI_MODEL=... docker compose up

x-java: &java
  restart: unless-stopped
  environment: &java-env
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP: kafka:9092
    DB_HOST: postgres
    JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-is-a-32+-byte-dev-secret}
    EARNINGS_URL: http://earnings-service:8101
    LEDGER_URL: http://ledger-service:8102
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gigpay
      POSTGRES_PASSWORD: gigpay
      POSTGRES_DB: gigpay
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigpay"]
      interval: 5s
      retries: 20
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    mem_limit: 128m

  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx320m -Xms320m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20
    mem_limit: 640m

  earnings-service:
    <<: *java
    build: { context: ., target: earnings-service }
    image: gigpay/earnings-service:1.0.0
    environment:
      <<: *java-env
      DB_NAME: earnings
    healthcheck: &health
      test: ["CMD", "curl", "-fs", "http://localhost:8101/actuator/health/readiness"]
      interval: 10s
      retries: 30
      start_period: 30s
    mem_limit: 448m

  ledger-service:
    <<: *java
    build: { context: ., target: ledger-service }
    image: gigpay/ledger-service:1.0.0
    environment:
      <<: *java-env
      DB_NAME: ledger
      # The mock bank runs inside ledger-service and calls its webhook back over HTTP.
      PROVIDER_URL: http://ledger-service:8102
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-dev-provider-webhook-secret}
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8102/actuator/health/readiness"]
    mem_limit: 448m

  coach-service:
    <<: *java
    build: { context: ., target: coach-service }
    image: gigpay/coach-service:1.0.0
    environment:
      <<: *java-env
      DB_NAME: coach
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      # The ONNX embedding model lives outside the Java heap, so leave it more native memory.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8103/actuator/health/readiness"]
      start_period: 60s
    mem_limit: 1g

  gateway:
    <<: *java
    build: { context: ., target: gateway }
    image: gigpay/gateway:1.0.0
    environment:
      <<: *java-env
      EARNINGS_SERVICE_URL: http://earnings-service:8101
      LEDGER_SERVICE_URL: http://ledger-service:8102
      COACH_SERVICE_URL: http://coach-service:8103
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
    ports: ["8083:8080"]
    mem_limit: 384m

  frontend:
    build: ./frontend
    image: gigpay/frontend:1.0.0
    restart: unless-stopped
    depends_on: [gateway]
    ports: ["3003:80"]
    mem_limit: 64m

volumes:
  pgdata:
