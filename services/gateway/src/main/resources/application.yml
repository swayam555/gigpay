spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          # Each route has exactly one rate limiter. (Stacking a global default-filter limiter on
          # top of a route's own limiter makes both share one Redis bucket with conflicting settings.)
          routes:
            # Money leaves here: a tight bucket per worker.
            - id: withdrawals
              uri: ${LEDGER_SERVICE_URL:http://localhost:8102}
              predicates:
                - Path=/api/wallet/withdrawals
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3
            # LLM calls cost money.
            - id: coach
              uri: ${COACH_SERVICE_URL:http://localhost:8103}
              predicates:
                - Path=/api/coach/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 6
            - id: ledger
              uri: ${LEDGER_SERVICE_URL:http://localhost:8102}
              predicates:
                - Path=/api/wallet/**,/api/ledger/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
            - id: earnings
              uri: ${EARNINGS_SERVICE_URL:http://localhost:8101}
              predicates:
                - Path=/api/earnings/**,/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100

server:
  port: ${PORT:8080}

gigpay:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-32+-byte-dev-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
