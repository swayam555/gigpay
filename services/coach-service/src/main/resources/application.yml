spring:
  application:
    name: coach-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coach}
    username: ${DB_USER:gigpay}
    password: ${DB_PASSWORD:gigpay}
    hikari:
      maximum-pool-size: 10

server:
  port: ${PORT:8103}
  shutdown: graceful

gigpay:
  earnings-url: ${EARNINGS_URL:http://localhost:8101}
  ledger-url: ${LEDGER_URL:http://localhost:8102}
  ai:
    provider: ${AI_PROVIDER:none}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    temperature: 0.3
    timeout: ${AI_TIMEOUT:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
