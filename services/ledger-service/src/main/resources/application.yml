spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger}
    username: ${DB_USER:gigpay}
    password: ${DB_PASSWORD:gigpay}
    hikari:
      maximum-pool-size: 20
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5

server:
  port: ${PORT:8102}
  shutdown: graceful

gigpay:
  provider-url: ${PROVIDER_URL:http://localhost:8102}
  provider-secret: ${PROVIDER_WEBHOOK_SECRET:dev-provider-webhook-secret}
  earnings-url: ${EARNINGS_URL:http://localhost:8101}
  settlement-every: ${SETTLEMENT_EVERY:120s}
  weekly-payout-every: ${WEEKLY_PAYOUT_EVERY:6h}

springdoc:
  api-docs:
    path: /api/wallet/openapi
  swagger-ui:
    path: /api/wallet/docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
