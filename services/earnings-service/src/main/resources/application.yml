spring:
  application:
    name: earnings-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:earnings}
    username: ${DB_USER:gigpay}
    password: ${DB_PASSWORD:gigpay}
    hikari:
      maximum-pool-size: 20
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5

server:
  port: ${PORT:8101}
  shutdown: graceful

gigpay:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-32+-byte-dev-secret}
  admin:
    username: ${ADMIN_USERNAME:finance}
    password: ${ADMIN_PASSWORD:gigpay}

springdoc:
  api-docs:
    path: /api/earnings/openapi
  swagger-ui:
    path: /api/earnings/docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

